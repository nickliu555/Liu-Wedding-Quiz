<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Playing · Liu Wedding Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/player.css" />
</head>
<body class="player">
  <!-- Ambient rose-petal drift, only visible while the player is waiting in
       the lobby (gated by body.player-waiting in CSS). -->
  <div class="petal-layer" aria-hidden="true">
    <span class="petal petal-1"></span>
    <span class="petal petal-2"></span>
    <span class="petal petal-3"></span>
    <span class="petal petal-4"></span>
  </div>

  <!-- Winner confetti — shown only when this player's final tier is 1
       (gold). Toggled by renderPlayerRank() removing the [hidden] attr.
       Pure CSS animation; 30 pieces in the wedding palette. -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true" hidden>
    <span class="confetti confetti-1"></span><span class="confetti confetti-2"></span>
    <span class="confetti confetti-3"></span><span class="confetti confetti-4"></span>
    <span class="confetti confetti-5"></span><span class="confetti confetti-6"></span>
    <span class="confetti confetti-7"></span><span class="confetti confetti-8"></span>
    <span class="confetti confetti-9"></span><span class="confetti confetti-10"></span>
    <span class="confetti confetti-11"></span><span class="confetti confetti-12"></span>
    <span class="confetti confetti-13"></span><span class="confetti confetti-14"></span>
    <span class="confetti confetti-15"></span><span class="confetti confetti-16"></span>
    <span class="confetti confetti-17"></span><span class="confetti confetti-18"></span>
    <span class="confetti confetti-19"></span><span class="confetti confetti-20"></span>
    <span class="confetti confetti-21"></span><span class="confetti confetti-22"></span>
    <span class="confetti confetti-23"></span><span class="confetti confetti-24"></span>
    <span class="confetti confetti-25"></span><span class="confetti confetti-26"></span>
    <span class="confetti confetti-27"></span><span class="confetti confetti-28"></span>
    <span class="confetti confetti-29"></span><span class="confetti confetti-30"></span>
  </div>

  <div class="player-top">
    <div class="player-name" id="playerName">—</div>
    <button type="button" class="lang-toggle" id="langToggle" aria-label="切换到中文 (Switch to Chinese)">中</button>
    <div class="player-score-chip">
      <span class="score-spark" aria-hidden="true">✨</span>
      <span class="score-num" id="playerScore">0</span>
      <span class="score-unit" id="scoreUnit">pts</span>
    </div>
  </div>

  <div class="player-view" id="playerView">
    <div class="state-card" id="stateCard">
      <h2>Connecting…</h2>
      <p>Hang tight.</p>
    </div>
  </div>

  <!-- Reaction bar: visible during lobby, reveal, and final phases. -->
  <div class="reaction-bar" id="reactionBar" hidden>
    <button type="button" class="reaction-btn" data-reaction="0" aria-label="laugh">😂</button>
    <button type="button" class="reaction-btn" data-reaction="1" aria-label="fire">🔥</button>
    <button type="button" class="reaction-btn" data-reaction="2" aria-label="eyes">👀</button>
    <button type="button" class="reaction-btn" data-reaction="3" aria-label="party">🎉</button>
    <button type="button" class="reaction-btn" data-reaction="4" aria-label="shock">😱</button>
    <button type="button" class="reaction-btn" data-reaction="5" aria-label="crown">👑</button>
    <div class="reaction-cooldown" id="reactionCooldown" hidden></div>
  </div>

  <footer class="credit-footer">Developed by Nick Liu (with help from Claude)</footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
