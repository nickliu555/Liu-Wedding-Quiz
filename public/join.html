<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join the Quiz · Liu Wedding</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/player.css" />
</head>
<body class="join">
  <!-- Ambient rose-petal drift. Six petals slowly fall behind everything.
       Pure CSS animation; sits in a fixed, pointer-events:none layer. -->
  <div class="petal-layer" aria-hidden="true">
    <span class="petal petal-1"></span>
    <span class="petal petal-2"></span>
    <span class="petal petal-3"></span>
    <span class="petal petal-4"></span>
    <span class="petal petal-5"></span>
    <span class="petal petal-6"></span>
  </div>

  <!-- Matching garland near the top to visually frame the page. -->
  <div class="vines-top vines-top-anchor" aria-hidden="true"></div>

  <div class="join-header">
    <div class="brand">Carly <span class="amp">&</span> Nick</div>
    <h1 class="serif" style="margin: 10px 0 4px;">Wedding Quiz</h1>
    <p>Enter your name to join the game</p>
  </div>

  <form id="joinForm" class="join-form" autocomplete="off">
    <label for="nameInput">Your full name:</label>
    <input id="nameInput" type="text" maxlength="25" autocapitalize="words" placeholder="Enter your First & Last name" required />
    <button type="submit" class="btn-primary">Join</button>
    <div id="errorMsg" class="error-msg" aria-live="polite"></div>
  </form>

  <!-- Shown when the host has already started the quiz. join.js toggles
       body.lobby-closed (which blurs the header + form behind) and the
       [hidden] attribute on this section. Sits above the blurred form
       as a centered, in-focus notice card. -->
  <section id="closedNotice" class="closed-notice" hidden aria-live="polite">
    <div class="closed-notice-card">
      <p class="closed-notice-title">The quiz has already started</p>
      <p class="closed-notice-sub">Sorry, you can't join now.</p>
    </div>
  </section>

  <!-- Decorative rose garland anchored above the credit footer -->
  <div class="vines-top vines-bottom-anchor" aria-hidden="true"></div>

  <footer class="credit-footer">Developed by Nick Liu (with help from Claude)</footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/join.js"></script>
</body>
</html>
